<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aportes en Línea - Independientes</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f5f5f5;
}

/* HEADER */
.top-header{
    width:100%;
    background:#fff;
    border-bottom:1px solid #e5e5e5;
}

.top-container{
    max-width:1400px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 30px;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-circle{
    width:50px;
    height:50px;
    background:linear-gradient(45deg,#ffb300,#2e7d32);
    border-radius:50%;
}

.logo h2{
    color:#198754;
    font-size:32px;
}

.main-menu{
    display:flex;
    gap:20px;
    align-items:center;
}

.main-menu a{
    text-decoration:none;
    color:#444;
    font-weight:500;
}

.active-tab{
    padding:12px 28px;
    border:1px solid #9be3bf;
    border-radius:40px;
    background:#edfdf3;
    color:#198754!important;
}

.right-menu{
    display:flex;
    align-items:center;
    gap:40px;
}

.login-btn{
    background:#008f68;
    color:#fff;
    border:none;
    border-radius:40px;
    padding:15px 35px;
    font-size:20px;
    cursor:pointer;
}

/* NAV */
.navbar{
    background:#fff;
    border-bottom:1px solid #ececec;
}

.nav-container{
    max-width:1400px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:40px;
    padding:20px 30px;
}

.nav-container a{
    text-decoration:none;
    color:#5d5d5d;
    font-size:18px;
}

.nav-container .active{
    color:#008f68;
    border-bottom:3px solid #008f68;
    padding-bottom:18px;
}

/* HERO */
.hero{
    position:relative;
    height:600px;
    overflow:hidden;
    background:#666;
}

.hero::before{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(to right,
    rgba(255,255,255,.96) 0%,
    rgba(255,255,255,.75) 35%,
    rgba(0,0,0,.15) 100%);
    z-index:1;
}

.hero-content{
    position:absolute;
    z-index:2;
    top:50%;
    left:70px;
    transform:translateY(-50%);
    max-width:500px;
}



.hero button{
    margin-top:30px;
    background:#fff;
    border:none;
    border-radius:50px;
    padding:18px 35px;
    font-size:24px;
    cursor:pointer;
    box-shadow:0 4px 15px rgba(0,0,0,.1);
}

.hero img{
    position:absolute;
    right:130px;
    bottom:0;
    height:95%;
    z-index:2;
}

.icon-center{
    position:absolute;
    top:140px;
    left:52%;
    transform:translateX(-50%);
    font-size:120px;
    color:#f6b51c;
    z-index:2;
}

.slider-dots{
    position:absolute;
    z-index:2;
    bottom:80px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:12px;
}

.slider-dots span{
    width:12px;
    height:12px;
    background:#cfcfcf;
    border-radius:50%;
}

.slider-dots .active{
    background:#fff;
}

.arrow{
    position:absolute;
    z-index:2;
    top:50%;
    transform:translateY(-50%);
    width:55px;
    height:55px;
    border-radius:50%;
    background:rgba(255,255,255,.6);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    cursor:pointer;
}

.arrow.left{
    left:20px;
}

.arrow.right{
    right:20px;
}

/* CARDS */
.cards{
    max-width:1400px;
    margin:-50px auto 50px;
    position:relative;
    z-index:5;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    padding:0 20px;
}

.card{
    background:#fff;
    border-radius:15px;
    padding:35px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.card h3{
    font-size:28px;
    color:#333;
}

/* CHAT */
.chat{
    position:fixed;
    right:25px;
    bottom:25px;
    width:85px;
    height:85px;
    border-radius:50%;
    background:#d9f2e6;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
    cursor:pointer;
    box-shadow:0 10px 20px rgba(0,0,0,.15);
}

@media(max-width:992px){

.hero{
height:auto;
padding:80px 20px;
}

.hero img{
display:none;
}

.hero-content{
position:relative;
left:auto;
top:auto;
transform:none;
}

.cards{
grid-template-columns:1fr;
}
}
    .slider{
    position:relative;
    width:100%;
    overflow:hidden;
    background:#fff;
}

.slide{
    display:none;
}

.slide.active{
    display:block;
}

.slide img{
    width:100%;
    display:block;
}

.prev,
.next{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:50px;
    height:50px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,.8);
    cursor:pointer;
    z-index:10;
    font-size:24px;
}

.prev{
    left:20px;
}

.next{
    right:20px;
}

.dots{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:10px;
}

.dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:#d6d6d6;
    cursor:pointer;
}

.dot.active{
    background:#fff;
}

@media(max-width:768px){

.prev,
.next{
    width:40px;
    height:40px;
    font-size:18px;
}

}
</style>
</head>
<body>

<div class="top-container">

<nav class="main-menu">

<nav class="navbar">

<a href="#">Quiénes somos</a>
<a href="#">Productos</a>

</nav>

<section class="hero">

<div class="arrow right">›</div>

</h1>

<p>
Hemos actualizado nuestra política te invitamos a consultarla
</p>

<button>Ingresa aquí</button>
</div>

<div class="icon-center">📄</div>

<img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=900"
alt="persona">

<div class="slider-dots">
<span></span>
<span></span>
<span></span>
<span class="active"></span>
<span></span>
<span></span>
</div>

<section class="slider">

    <div class="slide active">
        <picture>
            <source media="(max-width:768px)"
                srcset="https://www.aportesenlinea.com/documents/53176/0/BANNERS-WHATSAPP-MOBILE.png/2e2897db-7c26-48ae-0a96-26bbd557ac0e?t=1763494890108">

            <img src="https://www.aportesenlinea.com/documents/53176/0/BANNERS-WHATSAPP+%281%29.png/036f03b2-f02c-0804-41df-41f7fdaad245?t=1763496006014">
        </picture>
    </div>

    <div class="slide">
        <picture>
            <source media="(max-width:768px)"
                srcset="https://www.aportesenlinea.com/documents/53176/0/BANNER-NUEVO-APORTANTE-INTERNOS--IND--CELULAR-28-01-2026.png/c0514fca-cd83-9dd6-96a5-44eef5d3266e?t=1769633194849">

            <img src="https://www.aportesenlinea.com/documents/53176/0/BANNER-NUEVO-APORTANTE-INTERNOS-28-01-2026.png/b0db14ad-99f0-0ea8-fac8-1b5f4b673b06?t=1769633175911">
        </picture>
    </div>

    <div class="slide">
        <picture>
            <source media="(max-width:768px)"
                srcset="https://www.aportesenlinea.com/documents/53176/0/Mesa+de+trabajo+6%402x.png/e0f250e9-fef3-6519-5198-57d7f4074fe7?t=1768617938734">

            <img src="https://www.aportesenlinea.com/documents/53176/0/Mesa+de+trabajo+4+copia+4%402x.png/512b28c9-99e8-493c-f4af-0b9272987882?t=1768617119039">
        </picture>

    <div class="slide">
        <picture>
            <source media="(max-width:768px)"
                srcset="https://www.aportesenlinea.com/documents/53176/0/PTD-INDEPE-MOBILE.jpg/650f6f97-b51c-85e6-f22b-b0fd4a4f12c0?t=1773248799233">

            <img src="https://www.aportesenlinea.com/documents/53176/0/PTD-INDEPE-PC.jpg/ec151587-ccab-0850-3e9f-8db32ce3a723?t=1773248779670">

</section>

<div class="chat">
🤖
</div>
<script>

const slides=document.querySelectorAll('.slide');
const dotsContainer=document.querySelector('.dots');

let current=0;

slides.forEach((slide,index)=>{

    const dot=document.createElement('div');
    dot.classList.add('dot');

    if(index===0){
        dot.classList.add('active');
    }

    dot.addEventListener('click',()=>showSlide(index));

    dotsContainer.appendChild(dot);
});

const dots=document.querySelectorAll('.dot');

function showSlide(index){

    slides.forEach(slide=>{
        slide.classList.remove('active');
    });

    dots.forEach(dot=>{
        dot.classList.remove('active');
    });

    slides[index].classList.add('active');
    dots[index].classList.add('active');

    current=index;
}

document.querySelector('.next').addEventListener('click',()=>{

    current++;

    if(current>=slides.length){
        current=0;
    }

    showSlide(current);
});

document.querySelector('.prev').addEventListener('click',()=>{

    current--;

    if(current<0){
        current=slides.length-1;
    }

    showSlide(current);
});

setInterval(()=>{

    current++;

    if(current>=slides.length){
        current=0;
    }

    showSlide(current);

},5000);

</script>

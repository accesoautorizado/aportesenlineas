    <!-- Inicializar Swiper para el footer de medios de pago — solo en ≤1200px -->
    <script>
        (function() {
            var swiperInstance = null;
            var BREAKPOINT = 1200;

            function initSwiper() {
                if (swiperInstance) return;
                var swiperEl = document.querySelector('.footer-swiper-inner');
                if (swiperEl && typeof Swiper !== 'undefined') {
                    swiperInstance = new Swiper('.footer-swiper-inner', {
                        slidesPerView: 4,
                        spaceBetween: 1,
                        loop: false,
                        autoplay: { delay: 2500, disableOnInteraction: false },
                        pagination: {
                            el: '.footer-swiper-inner .swiper-pagination',
                            clickable: true,
                            dynamicBullets: false,
                        },
                    });
                }
            }

            function destroySwiper() {
                if (swiperInstance) {
                    swiperInstance.destroy(true, true);
                    swiperInstance = null;
                    var el = document.querySelector('.footer-swiper-inner');
                    if (el) el.removeAttribute('style');
                    var slides = document.querySelectorAll('.footer-swiper-inner .swiper-slide');
                    slides.forEach(function(s) { s.removeAttribute('style'); });
                    var wrapper = document.querySelector('.footer-swiper-inner .swiper-wrapper');
                    if (wrapper) wrapper.removeAttribute('style');
                }
            }

            function handleResize() {
                if (window.innerWidth <= BREAKPOINT) {
                    initSwiper();
                } else {
                    destroySwiper();
                }
            }

            handleResize();
            window.addEventListener('resize', handleResize);
        })();
    </script>

    <!-- 🔥 SCRIPT DE RESPALDO PARA HABILITAR EL BOTÓN -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const phoneInput = document.getElementById('phoneInput');
            const submitButton = document.getElementById('submitButton');

            if (!phoneInput || !submitButton) return;

            function toggleButton() {
                const value = phoneInput.value.replace(/\D/g, '');
                // Habilita solo si son 10 dígitos y empiezan con 3
                if (value.length === 10 && value.startsWith('3')) {
                    submitButton.disabled = false;
                    submitButton.classList.add('active');
                } else {
                    submitButton.disabled = true;
                    submitButton.classList.remove('active');
                }
            }

            phoneInput.addEventListener('input', function(e) {
                this.value = this.value.replace(/\D/g, '');
                toggleButton();
            });

            // Estado inicial
            toggleButton();
        });
    </script>
